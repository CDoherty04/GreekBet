[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

# Both clusters point at the same program id, matching the keypair at
# $CARGO_TARGET_DIR/deploy/greekbet-keypair.json and `declare_id!` in
# programs/greekbet/src/lib.rs. `anchor keys sync` only rewrites the entry for
# the *configured* cluster, so after running it, check the other one by hand —
# it silently left devnet stale once already.
#
# WARNING (T10): that keypair lives in the shared CARGO_TARGET_DIR
# (~/.cache/greekbet-target), NOT in the repo, and it is gitignored. If that
# cache is wiped the keypair is gone and a rebuild mints a new program id,
# orphaning anything already deployed to devnet. Back it up before deploying.
[programs.devnet]
greekbet = "GRUTmtYopUczvS5m62YAvctbS9TTrbznnnj5GmFHumSZ"

[programs.localnet]
greekbet = "GRUTmtYopUczvS5m62YAvctbS9TTrbznnnj5GmFHumSZ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# BUILD/TEST SEQUENCE — `anchor build --arch v0` is mandatory. Anchor 1.2.0
# defaults to sbpf v3, which Agave 3.1.10 cannot load ("invalid file header" on
# deploy, "Unsupported program id" at the validator). `anchor test` has no
# --arch flag of its own, so:
#
#   anchor build --arch v0
#   anchor test --validator legacy --skip-build
#
# `--validator legacy` selects solana-test-validator; Anchor 1.2's default,
# surfpool, is not installed. A stale v0 .so in deploy/ makes a broken v3 build
# look like it passed — wipe deploy/ if results surprise you.
# See docs/TOOLCHAIN.md §5.
#
# Two things in this command line are load-bearing, both from T09:
#
# * `NODE_OPTIONS=--no-experimental-strip-types` forces mocha down its
#   `require()` path so **ts-node** transpiles the suite. Node 24 strips types
#   natively, and mocha 9 tries `import()` before `require()`, so without this
#   a spec file is transpiled by whichever loader happens to win - and node's
#   strip-only mode rejects perfectly ordinary TypeScript (parameter
#   properties, enums) with a bare SyntaxError. Which loader ran depended on
#   whether every import in the file resolved as ESM, which is not a property
#   anyone should have to reason about.
# * `--ignore tests/utils.ts` keeps the shared fixture module out of the spec
#   list. It defines helpers and no `describe`, so loading it as a test file
#   only creates a way for it to fail.
#
# The glob is overridable so a single file can be run against the same
# validator setup:
#   GB_TESTS='tests/negative.ts' anchor test --skip-build --validator legacy
[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types yarn run ts-mocha -p ./tsconfig.json -t 1000000 --ignore \"tests/utils.ts\" \"${GB_TESTS:-tests/**/*.ts}\""

[hooks]
